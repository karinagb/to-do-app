<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header><h1>My Tasks</h1></header>
    <main>
      <form class="add-task">
        <h3>New Task</h3>
        <input type="text" name="new-task" placeholder="task..." />
        <button>Add</button>
      </form>

      <div class="states">
        <div class="state to-do">
          <h2>To Do</h2>
          <ul class="list to-do-list">
          </ul>
        </div>
        <div class="state doing">
          <h2>Doing</h2>
          <ul class="list doing-list">
          </ul>
        </div>
        <div class="state done">
          <h2>Done</h2>
          <ul class="list done-list">
          </ul>
        </div>
      </div>
    </main>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
